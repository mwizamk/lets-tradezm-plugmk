<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment — Let's Trade ZM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav shell">
  <a class="brand" href="index.html"><span class="brand-mark">LT</span><span>Let's Trade <b>ZM</b></span></a>
  <a class="nav-back" href="index.html">Need help?</a>
</header>
<main class="center-page shell">
  <section class="form-panel payment-panel">
    <div class="progress"><span class="active"></span><span class="active"></span><span></span></div>
    <span class="kicker">PAYMENT</span>
    <h1>Finish your request.</h1>
    <div id="paymentSummary" class="selected-product">Loading order…</div>
    <form id="paymentForm">
      <label>Payment method
        <select id="paymentMethod" required>
          <option value="">Choose a method</option>
          <option value="Airtel Money">Airtel Money</option>
          <option value="MTN Money">MTN Money</option>
          <option value="Bank Transfer">Bank Transfer</option>
        </select>
      </label>
      <label>Transaction reference
        <input id="transactionRef" type="text" placeholder="Enter the reference from your payment" required>
      </label>
      <label>Amount paid (ZMW)
        <input id="amount" type="number" min="0" step="0.01" readonly required>
      </label>
      <div id="paymentMessage" class="form-message" role="alert" aria-live="polite"></div>
      <button id="paymentButton" class="btn btn-primary full-btn" type="submit">Submit payment <span>→</span></button>
    </form>
  </section>
</main>
<script type="module" src="js/payment.js"></script>
</body>
</html>
