<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Trade ZM | Customer Login</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
<header class="navbar">
  <a href="index.html" class="logo"><span>Let's</span> Trade ZM</a>
  <a href="index.html" class="secondary-btn">Home</a>
</header>
<main class="auth-container">
  <section class="auth-card">
    <span class="eyebrow">CUSTOMER ACCESS</span>
    <h1>Welcome back</h1>
    <p>Sign in with the phone number or email connected to your account.</p>

    <div id="loginMessage" class="form-message" role="status"></div>

    <div class="auth-tabs" role="tablist">
      <button type="button" id="emailTab" class="auth-tab active">Email</button>
      <button type="button" id="phoneTab" class="auth-tab">Phone</button>
    </div>

    <form id="emailForm">
      <label for="loginEmail">Email address</label>
      <input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com">
      <button type="submit" class="primary-btn full-btn" id="emailButton">Send sign-in link</button>
      <p class="help-text">We will email you a secure one-time sign-in link. No password is required.</p>
    </form>

    <form id="phoneForm" hidden>
      <label for="loginPhone">Zambian phone number</label>
      <input id="loginPhone" type="tel" autocomplete="tel" placeholder="097xxxxxxx or +26097xxxxxxx">
      <div id="recaptcha-container"></div>
      <button type="submit" class="primary-btn full-btn" id="phoneButton">Send verification code</button>
      <div id="otpPanel" hidden>
        <label for="otpCode">Verification code</label>
        <input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
        <button type="button" class="primary-btn full-btn" id="verifyOtpButton">Verify & continue</button>
      </div>
      <p class="help-text">Firebase sends a verification code to your phone.</p>
    </form>

    <div class="auth-links">
      <a href="signup.html">New customer? Get started</a>
      <a href="index.html#prices">View PriceList</a>
    </div>
  </section>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
